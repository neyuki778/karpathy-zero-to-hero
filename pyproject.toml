[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karpathy-zero-to-hero"
version = "0.1.0"
description = "Study workspace for Andrej Karpathy's Zero to Hero neural network series."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "graphviz>=0.20",
    "tqdm>=4.66",
    "jupyterlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = []
